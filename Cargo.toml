[package]
name = "lau-swarm-intelligence"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/SuperInstance/lau-swarm-intelligence"
description = "Swarm intelligence algorithms: ACO, PSO, bee algorithm, firefly, wolf pack, bacterial foraging, SDS, and flocking (Boids)"

[dependencies]
serde = { version = "1", features = ["derive"] }
nalgebra = "0.33"
rand = "0.8"

[dev-dependencies]
approx = "0.5"
serde_json = "1"
